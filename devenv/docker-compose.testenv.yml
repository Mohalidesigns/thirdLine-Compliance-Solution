# Local test bed for the Atheris workflow features (Part 1 notifications + Part 2 LDAP).
#
#   docker compose -f devenv/docker-compose.testenv.yml up -d
#
# Services
#   mailpit   SMTP sink on 1025, web inbox on http://localhost:8025  (escalations, invites,
#             remediation links). No auth, no TLS — matches the tenant app's SMTP_* defaults.
#   openldap  Directory on ldap://localhost:1389, seeded from ldif/atheris.ldif. The tenant
#             app's LDAP settings point here.
#   phpldapadmin  Web UI to inspect/edit the directory at http://localhost:8080
#
# The LDIF seeds the identities used by onboarding/SoD tests:
#   analyst@atheris.test / cco@atheris.test / owner@atheris.test / manager@atheris.test
# and one owner with no directory entry (see devenv/README.md).
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: atheris-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    restart: unless-stopped

  openldap:
    image: osixia/openldap:1.5.0
    container_name: atheris-openldap
    command: ["--copy-service", "--loglevel", "info"]
    ports:
      - "1389:389"    # LDAP
      - "1636:636"    # LDAPS (unused by default)
    environment:
      LDAP_ORGANISATION: Atheris
      LDAP_DOMAIN: atheris.test
      LDAP_BASE_DN: dc=atheris,dc=test
      LDAP_ADMIN_PASSWORD: adminpassword
      # Extra entries seeded after bootstrap (the base dc=atheris,dc=test is created
      # from LDAP_DOMAIN above, so the LDIF only adds ou=people + users).
      LDAP_SEED_INTERNAL_LDIF_PATH: /ldifs
    volumes:
      # NOTE (colima): the VM only shares $HOME, not macOS /var or /tmp. If the repo
      # lives outside $HOME, set LDIF_DIR to a copy under $HOME, e.g.
      #   LDIF_DIR="$HOME/.atheris-devenv/ldif" docker compose ... up -d
      - ${LDIF_DIR:-./ldif}:/ldifs:ro
    restart: unless-stopped

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: atheris-phpldapadmin
    depends_on:
      - openldap
    ports:
      - "8080:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    restart: unless-stopped
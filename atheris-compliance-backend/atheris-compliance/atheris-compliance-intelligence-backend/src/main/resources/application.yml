spring:
  application:
    name: atheris-compliance-intelligence-backend
  # Read the repo-root .env so the app boots without exporting it first (IDE
  # launches, fresh terminals). Paths cover running from the module dir, the
  # parent pom dir, or the repo root. Real environment variables still win.
  config:
    import:
      - optional:file:../../../.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:./.env[.properties]
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atheris_intel}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      # Implicit TLS (port 465): SMTP_SSL=true and SMTP_STARTTLS=false.
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  ai:
    # Primary AI provider — Google Gemini via its OpenAI-compatible endpoint. base-url is the
    # host+version (no path); completions-path completes it. Credentials from env only — no literals.
    openai:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${AI_PRIMARY_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      chat:
        completions-path: ${AI_PRIMARY_COMPLETIONS_PATH:/openai/chat/completions}
        options:
          model: ${AI_MODEL:gemini-3.8-flash}
          temperature: 0.0
          max-tokens: ${AI_MAX_TOKENS:32000}

server:
  port: ${PORT:9090}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

atheris:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  encryption-key: ${ENCRYPTION_KEY:temporary-dev-encryption-key-change-in-prod}

  ai:
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    cooldown-initial-ms: 60000     # 1 minute initial cooldown on rate limit/error (fast recovery)
    cooldown-max-ms: 300000        # 5 minutes max cooldown
    cooldown-multiplier: 3         # multiply cooldown by 3 each consecutive failure
    # Primary = Google Gemini (AI_MODEL). Fallback = a SECOND provider with its own base-url +
    # key (the ISW AI gateway); when fallback-base-url is blank the fallback reuses the primary.
    # All values are env-driven — no secrets here.
    primary-model: ${AI_MODEL:gemini-3.8-flash}
    fallback-model: ${AI_FALLBACK_MODEL:deepseek-v4.1}
    fallback-base-url: ${AI_FALLBACK_BASE_URL:https://ai-gateway.isw.la}
    fallback-api-key: ${AI_FALLBACK_API_KEY:}
    # OpenRouter reasoning switch (primary only): unset = send nothing (provider default);
    # false = {"reasoning":{"enabled":false}} (reasoning models otherwise burn max-tokens thinking).
    reasoning-enabled: ${AI_REASONING_ENABLED:}
    # OCR text handed to the classifier: split into fixed-size chunks and merged. 0 = no cap
    # (the whole document is processed). Small chunks keep each AI call fast.
    max-ocr-chars: ${AI_MAX_OCR_CHARS:0}
    chunk-size: ${AI_CHUNK_SIZE:15000}

  jwt:
    secret: ${JWT_SECRET:atheris-platform-jwt-secret-change-in-production-min-32-chars}
    expiry-minutes: 1440
    refresh-token-expiry-days: 30

  email:
    from: ${EMAIL_FROM:noreply@atheris.com}
    base-url: ${BASE_URL:https://app.atheris.com}

  storage:
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${S3_BUCKET:atheris-platform-docs}
    region: ${AWS_REGION:af-south-1}
    local-path: ${STORAGE_LOCAL_PATH:../../../data/storage}

  scraper:
    user-agent: "Atheris-HorizonScanner/1.0 (compliance@atheris.com)"
    request-timeout-seconds: 30
    max-pdf-size-mb: 100

  jobs:
    scraper-interval-ms: 900000       # 15 minutes
    ocr-processor-interval-ms: 120000 # 2 minutes
    classifier-interval-ms: 100000    # 1.5 minutes
    applicability-interval-ms: 300000 # 5 minutes
    webhook-sender-interval-ms: 300000 # 5 minutes
    webhook-retry-interval-ms: 1800000 # 30 minutes

logging:
  level:
    com.atheris.compliance: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

spring:
  application:
    name: atheris-compliance-intelligence-backend
  # Read the repo-root .env so the app boots without exporting it first (IDE
  # launches, fresh terminals). Paths cover running from the module dir, the
  # parent pom dir, or the repo root. Real environment variables still win.
  config:
    import:
      - optional:file:../../../.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:./.env[.properties]
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atheris_intel}
    username: ${DB_USER:atheris}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  ai:
    # OpenAI-compatible client pointed at OpenRouter. base-url omits /v1 —
    # Spring AI appends the default completions-path /v1/chat/completions.
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: ${AI_BASE_URL:https://openrouter.ai/api}
      chat:
        options:
          model: ${AI_MODEL:google/gemini-2.5-flash-lite}
          temperature: 0.0
          max-tokens: 3500

server:
  port: ${PORT:9090}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

atheris:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  encryption-key: ${ENCRYPTION_KEY:temporary-dev-encryption-key-change-in-prod}

  ai:
    fallback-enabled: true
    cooldown-initial-ms: 300000    # 5 minutes initial cooldown on rate limit
    cooldown-max-ms: 900000        # 15 minutes max cooldown
    cooldown-multiplier: 3         # multiply cooldown by 3 each consecutive failure
    # OpenRouter model ids. Primary follows AI_MODEL (same as spring.ai.openai above);
    # the fallback is tried when the primary is rate-limited or failing.
    primary-model: ${AI_MODEL:google/gemini-2.5-flash-lite}
    fallback-model: ${AI_FALLBACK_MODEL:google/gemini-2.0-flash-lite-001}

  jwt:
    secret: ${JWT_SECRET:atheris-platform-jwt-secret-change-in-production-min-32-chars}
    expiry-minutes: 1440
    refresh-token-expiry-days: 30

  email:
    from: ${EMAIL_FROM:noreply@atheris.com}
    base-url: ${BASE_URL:https://app.atheris.com}

  storage:
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${S3_BUCKET:atheris-platform-docs}
    region: ${AWS_REGION:af-south-1}
    local-path: ${STORAGE_LOCAL_PATH:../../../data/storage}

  scraper:
    user-agent: "Atheris-HorizonScanner/1.0 (compliance@atheris.com)"
    request-timeout-seconds: 30
    max-pdf-size-mb: 100

  jobs:
    scraper-interval-ms: 900000       # 15 minutes
    ocr-processor-interval-ms: 120000 # 2 minutes
    classifier-interval-ms: 100000    # 1.5 minutes
    applicability-interval-ms: 300000 # 5 minutes
    webhook-sender-interval-ms: 300000 # 5 minutes
    webhook-retry-interval-ms: 1800000 # 30 minutes

  points:
    batch-size: 5        # obligations per LLM call (max ~30 for Gemini Flash Lite 8k output tokens)
    delay-ms: 1000        # delay between batches (ms) — used by PointsRetryScheduler sequential fallback
    retry-interval-ms: 900000   # 15 minutes — how often to retry failed obligations
    concurrency: 5        # max parallel LLM calls in batch generation
    stagger-ms: 500       # delay between submitting each batch (prevents burst rate limit)
    retry-attempts: 3     # per-batch retry attempts before marking as failed
    retry-delays-ms: 2000,5000  # delays between retries (ms)

logging:
  level:
    com.atheris.compliance: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

server:
  port: ${PORT:9091}

spring:
  application:
    name: atheris-compliance-tenant-backend
  # Read the repo-root .env so the app boots without exporting it first (IDE
  # launches, fresh terminals). Paths cover running from the module dir, the
  # parent pom dir, or the repo root. Real environment variables still win.
  config:
    import:
      - optional:file:../../../.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atheris_tenant}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Outbound email. If SMTP_HOST is unset, mail is disabled and every send is
  # logged and skipped (the app still boots). Point it at Mailpit for local dev.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  flyway:
    enabled: true
    locations: classpath:db/migration/tenant
  # LDAP is configured per-tenant at runtime (stored on tenant_profile, bind password
  # encrypted). Connections are built programmatically, so no global spring.ldap.urls is
  # needed and the app boots whether or not a directory is reachable.
  data:
    ldap:
      repositories:
        enabled: false

# LDAP and mail are optional integrations: connections are built per-request and email
# is skipped when SMTP is unset. Their auto-configured health probes would otherwise mark
# the whole app DOWN when a directory/mail server is unreachable.
management:
  health:
    ldap:
      enabled: false
    mail:
      enabled: false

atheris:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-a-long-random-base64-secret}
    expiry-minutes: 1440
  platform:
    base-url: ${PLATFORM_BASE_URL:http://localhost:9090}
    encryption-key: ${ENCRYPTION_KEY:temporary-dev-encryption-key-change-in-prod}
  email:
    from: ${EMAIL_FROM:noreply@atheris.com}
    # Base URL used to build click-through links in emails (the remediation page).
    base-url: ${BASE_URL:http://localhost:5174}
  # Filing links let a responsible person submit without an account. One stable link per filing
  # period, derived from the filing id and this secret; it stays valid while the period is open.
  returns:
    upload-link-expiry-days: ${UPLOAD_LINK_EXPIRY_DAYS:30}
    upload-link-secret: ${UPLOAD_LINK_SECRET:${ENCRYPTION_KEY:atheris-dev-upload-link-secret}}
  # Remediation links let an owner submit evidence without an account.
  remediation:
    link-expiry-grace-days: ${REMEDIATION_LINK_GRACE_DAYS:7}
    max-file-size-mb: ${REMEDIATION_MAX_FILE_MB:20}
    max-files: ${REMEDIATION_MAX_FILES:5}
  # Dev only — never enable in production. Seeds admin@/cco@/analyst@/auditor@<domain>.
  seed:
    users:
      enabled: ${SEED_USERS_ENABLED:false}
      domain: ${SEED_USERS_DOMAIN:mamcorp.test}
      password: ${SEED_USERS_PASSWORD:}
logging:
  level:
    com.atheris.compliance: DEBUG
    com.atheris.compliance.tenant.backend.modules.obligations.service.RegulationSeedService: INFO
    org.springframework.web.client: WARN
    org.springframework.http.client: WARN

server:
  port: ${PORT:9091}

spring:
  application:
    name: atheris-compliance-tenant-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atheris_tenant}
    username: ${DB_USER:atheris}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/tenant

atheris:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-a-long-random-base64-secret}
    expiry-minutes: 1440
  returns:
    instance-lookahead-days: 120
    escalation-thresholds: "2,5"
  platform:
    base-url: ${PLATFORM_BASE_URL:http://localhost:9090}
    encryption-key: ${ENCRYPTION_KEY:temporary-dev-encryption-key-change-in-prod}
logging:
  level:
    com.atheris.compliance: DEBUG
    com.atheris.compliance.tenant.backend.modules.obligations.service.RegulationSeedService: INFO
    org.springframework.web.client: WARN
    org.springframework.http.client: WARN
